name: Windows desktop
on:
  push:
    branches: ['**']
    paths: ['windows/**', '.github/workflows/windows.yml']
  pull_request:
    paths: ['windows/**', '.github/workflows/windows.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-fund
      - name: Type, rendering and file protection checks
        run: npm run check && npm test && npm run build
      - name: Exercise the Windows desktop application
        run: npm run test:app
      - name: Build Windows x64 installer and portable application
        run: npm run pack:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Exercise the packaged Windows application
        run: npm run test:app
        env:
          FRAME_STUDIO_EXECUTABLE: '${{ github.workspace }}\windows\release\win-unpacked\FrameStudio.exe'
      - name: Install and launch both distributable packages
        run: ./scripts/smoke-distributions.ps1
      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: FrameStudio-Windows-x64
          path: windows/release/*.exe
          if-no-files-found: error
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-test-evidence
          path: |
            windows/.artifacts/*.png
            windows/.artifacts/app-test-results.json
            windows/.artifacts/playwright/**
          if-no-files-found: ignore
